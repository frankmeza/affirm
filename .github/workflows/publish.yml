name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24" # ships npm 11.x, which trusted publishing requires (>= 11.5.1)
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:eslint9
      - run: npm run build
      - run: npm run test:types:ts59
      - run: npm run test:types:consumer
      # NPM_TOKEN is only needed for the very first publish; delete the secret
      # once a trusted publisher is configured on npmjs.com.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
